<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF</title>

    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
</head>

<body>
    <!-- data-pdf: URL of the document to show; data-download-name: file name the download button saves it as.
         The title and these two attributes are what the Nix pdfRenderer function fills in (default.nix). -->
    <main id="root" data-pdf="./document.pdf" data-download-name="document.pdf"></main>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
