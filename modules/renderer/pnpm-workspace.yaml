# pnpm settings (pnpm >= 10 reads them here, not from package.json).

# Fetch the platform-specific binaries (biome, rolldown, typescript, ...) for
# exactly the systems the flake builds for, whatever machine runs the install:
# this keeps the Nix offline store identical across build hosts (default.nix).
supportedArchitectures:
  os: [darwin, linux]
  cpu: [x64, arm64]
  libc: [glibc]

# pnpm 11 refuses any package published less than 24 h ago by default. Renovate
# proposes versions the moment they exist and the Nix fetcher runs this check
# with the build host's clock, so a Renovate PR failed in CI depending on when
# it ran. Nix pins the lockfile and its integrity hashes, so there is no
# resolution to protect: accept any age.
minimumReleaseAge: 0
