# pnpm settings (pnpm >= 10 reads them here, not from package.json). For the
# local dev loop: the Nix install stages only package.json (default.nix).

# pnpm 11 refuses packages published less than 24 h ago by default, so a
# lockfile Renovate bumped minutes ago fails `pnpm install`. Accept any age,
# as the Nix install already does (--trust-lockfile). What this gives up is
# pnpm's cool-down against a just-published compromised version.
minimumReleaseAge: 0
