name: PR

on:
  pull_request:

permissions:
  contents: read

# A newer push to the same PR supersedes the run in progress.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned image, not ubuntu-latest (which GitHub re-points): bump deliberately.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      # pinned by commit: the action publishes only major tags (v23), which can move
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Format, lint and typecheck of the renderer (modules/renderer/default.nix).
      - run: nix flake check -L

      # The deployable site must build on every PR; what main.yml would deploy
      # is this same derivation, built here only to prove it (nothing is kept).
      - run: nix build .#site -L
